    <main>
        <section class="container small-container">
            <div class="flex-row flex-sb align-center">
                <h1>Registracija asistenta ili admina</h1>
                <a href="admin_glavna.html" class="text-decoration-none">
                    <button class="secondary-button self-start">Nazad</button>
                </a>
            </div>
            <form action="admin_glavna.html" class="self-center">
                <label for="username">Korisničko ime</label>
                <input type="text" id="username" name="username" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <div class="flex-row align-center gap-16 w-100">
                    <div class="flex-column w-100">
                        <label for="first_name">Ime</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="flex-column w-100">
                        <label for="last_name">Prezime</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                </div>
                <label for="password">Lozinka</label>
                <input type="password" id="password" name="password" required>
                <label for="password_repeat">Ponovi lozinku</label>
                <input type="password" id="password_repeat" name="password_repeat" required>
                <label>Uloga</label>
                <div class="flex-row align-center flex-sa w-100">
                    <div class="flex-row align-center">
                        <input type="radio" id="asistent" name="role" value="asistent" checked />
                        <label for="asistent">Asistent</label>
                    </div>
                    <div class="flex-row align-center">
                        <input type="radio" id="admin" name="role" value="admin" />
                        <label for="admin">Admin</label>
                    </div>
                </div>
                <button type="submit" class="self-center mt-16">Registruj</button>
            </form>
        </section>
    </main>
    <script>
        const password = document.getElementById('password');
        const passwordRepeat = document.getElementById('password_repeat');

        function validatePassword() {
            if (password.value !== passwordRepeat.value) {
                passwordRepeat.setCustomValidity('Lozinke se ne podudaraju.');
            } else {
                passwordRepeat.setCustomValidity('');
            }
        }

        password.addEventListener('input', validatePassword);
        passwordRepeat.addEventListener('input', validatePassword);
    </script>
