    <main>
        <section class="container medium-container">
            <div class="flex-row flex-sb align-center">
                <h1>Novi zadatak</h1>
                <a href="asistent_glavna.html" class="text-decoration-none">
                    <button class="secondary-button self-start">Nazad</button>
                </a>
            </div>
            <form action="asistent_glavna.html">
                <label for="title">Naslov</label>
                <input type="text" id="title" name="title" required
                    oninvalid="this.setCustomValidity('Upišite naslov.')" oninput="this.setCustomValidity('')">
                <label for="description">Opis</label>
                <textarea id="description" name="description" rows="10" required
                    oninvalid="this.setCustomValidity('Napišite tekst zadatka.')"
                    oninput="this.setCustomValidity('')"></textarea>
                <label for="deadline">Rok</label>
                <input type="datetime-local" id="deadline" name="deadline" required>
                <button type="submit" class="self-center mt-16">Kreiraj</button>
            </form>
        </section>
    </main>
    <script>
        const deadlineInput = document.getElementById('deadline');

        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        deadlineInput.setAttribute('min', now.toISOString().slice(0, 16));

        function validate() {
            if (deadlineInput.validity.rangeUnderflow || deadlineInput.validity.valueMissing) {
                deadlineInput.setCustomValidity('Izaberite validan rok za izradu.');
            } else {
                deadlineInput.setCustomValidity('');
            }
        }

        deadlineInput.addEventListener('input', validate);
        deadlineInput.addEventListener('invalid', validate);
    </script>
