    <main>
        <section class="container small-container">
            <div class="flex-row flex-sb align-center">
                <h1>Registracija grupe studenata</h1>
                <a href="admin_glavna.html" class="text-decoration-none">
                    <button class="secondary-button self-start">Nazad</button>
                </a>
            </div>
            <form action="admin_glavna.html" class="self-center">
                <label for="file">CSV fajl</label>
                <input type="file" id="file" name="file" required accept=".csv">
                <button type="submit" class="self-center mt-16">Registruj</button>
            </form>
        </section>
    </main>


    <script>
        const fileInput = document.getElementById('file');

        fileInput.addEventListener('change', function () {
            const file = this.files[0];
            const allowedTypes = ['text/csv'];

            if (file && !allowedTypes.includes(file.type)) {
                this.setCustomValidity('Molimo Vas upload-ujte samo .csv fajlove.');
                this.reportValidity();
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
