{% extends "app/base.html" %}

{% block title %}Registracija grupe studenata | PSI++{% endblock %}

{% block content %}
<section class="container small-container">
    <div class="flex-row flex-sb align-center">
        <h1>Registracija grupe studenata</h1>
        <a href="{% url 'upravljanje:glavna' %}" class="text-decoration-none">
            <button class="secondary-button self-start">Nazad</button>
        </a>
    </div>
    <form method="post" class="self-center" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-error">{{ form.non_field_errors }}</div>
        {% for f in form %}
          <div class="form-row">
            <label for="{{ f.id_for_label }}">{{ f.label }}</label>
            <div class="form-input">{{ f }}</div>
          </div>
          <div class="form-error">{{ f.errors }}</div>
        {% endfor %}
        <button type="submit" class="self-center mt-16">Registruj</button>
    </form>
</section>
{% endblock %}
